name: Local source checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-checks:
    name: Node 22 / synthetic fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.2'
          package-manager-cache: false
      - name: Use the validated npm version
        run: npm install --global npm@10.9.8
      - name: Install locked dependencies
        run: npm ci
      - name: Check public source boundaries
        run: npm run check:source
      - name: Run local regression tests
        run: npm test
      - name: Run synthetic OCR tests
        run: npm run test:ocr
