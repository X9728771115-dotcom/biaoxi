name: 功能建议 / Feature request
description: 描述具体工作步骤和预期结果，使用合成示例。
title: '[Feature] '
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem
      description: 目前哪一步受阻，谁会使用，预期改善是什么？请勿填写真实项目或企业信息。
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: 合成示例与预期行为 / Synthetic example and expected behavior
      description: 用自行编写的条款或流程说明输入、输出和人工复核要求。
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 范围与验收 / Scope and acceptance
      description: 哪些行为应改变，如何验证；是否涉及联网、数据目录、导出或旧报告兼容？
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 公开内容确认 / Public content check
      options:
        - label: 建议和示例未包含真实招标材料、企业原件、个人信息、账号或密钥。
          required: true
